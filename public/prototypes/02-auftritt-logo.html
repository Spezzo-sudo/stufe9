<title>Stufe 9 Auftritt</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: eine dunkle Bühne. Zuerst stehen sechs Forschungsfelder als Punktwolken im Raster, dann fliessen alle Punkte in die Mitte und werden zum Logo. */
:root {
  color-scheme: dark;
  --ink: #070D0F; --ink-line: #2A3C40; --signal: #FF5A0A;
  --on-ink: #EAF0ED; --on-ink-muted: #8EA3A2;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
body { background: var(--ink); color: var(--on-ink); font: 400 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
p, h1 { margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.tag { font: 500 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--on-ink-muted); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }

.stage { position: relative; height: clamp(600px, 62vw, 680px); border: 1px solid var(--ink-line); overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 4vw, 40px); padding: 16px; box-sizing: border-box; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lock { all: unset; cursor: pointer; display: flex; align-items: flex-end; gap: .4em; font-size: clamp(34px, 9.2vw, 100px); -webkit-tap-highlight-color: transparent; }
.lock .ph { width: 2.21em; height: 1em; }
.lock b { font: 700 1.08em/.72 var(--display); letter-spacing: .07em; white-space: nowrap; }
.copy { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
h1 { font: 700 clamp(26px, 5vw, 52px)/.95 var(--display); text-transform: uppercase; }
h1 em { font-style: normal; color: var(--signal); }
.lock b, .copy { transition: opacity .6s ease-out; }
.stage.pre .copy { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .lock b, .copy { transition: none; } }

.bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.bar button { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 12px 16px; background: var(--on-ink); color: var(--ink); border: 0; cursor: pointer; }
.bar p { color: var(--on-ink-muted); max-width: 58ch; }
</style>

<div class="wrap">
  <section class="stage" id="stage">
    <canvas id="cv" aria-hidden="true"></canvas>
    <button class="lock" id="lock" aria-label="Stufe 9, Auftritt abspielen"><span class="ph" id="ph"></span><b>STUFE 9</b></button>
    <div class="copy">
      <h1>Serienreif oder nur <em>versprochen?</em></h1>
      <div class="tag">Frontier-Tech im Reality Check · Skala 1 bis 9</div>
    </div>
  </section>
  <div class="bar">
    <button id="again">Auftritt nochmal abspielen</button>
    <p>Das Logo steht von Anfang an in der Mitte, die leeren Segmente warten. Die sechs Felder fliessen hinein und füllen die Skala. Ein Tipp aufs Logo spielt es nochmal.</p>
  </div>
</div>

<script>
const stage = document.getElementById("stage"), cv = document.getElementById("cv"), ctx = cv.getContext("2d"), ph = document.getElementById("ph");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const N = 15000; let P = [], bars = [], F = 0, W = 0, H = 0, mark = { x: 0, y: 0 }, t0 = 0, hold = 0, labels = [], shown = true, running = false;

const hexPath = (c, x, y, r) => { c.beginPath(); for (let i = 0; i < 6; i++) c.lineTo(x + r * Math.cos(i * Math.PI / 3), y + r * Math.sin(i * Math.PI / 3)); c.closePath(); c.fill(); };
const SHAPES = [
  ["Fusion", (c, s) => { c.lineWidth = .3 * s; c.beginPath(); c.ellipse(0, 0, 1.05 * s, .5 * s, 0, 0, 7); c.stroke(); }],
  ["Teleskope", (c, s) => { const r = .21 * s; for (let q = -2; q <= 2; q++) for (let k = -2; k <= 2; k++) { if (Math.abs(q + k) > 2 || (!q && !k)) continue; hexPath(c, 1.5 * r * q, Math.sqrt(3) * r * (k + q / 2), r * .9); } }],
  ["Biotech", (c, s) => { c.lineWidth = .1 * s; for (const sg of [1, -1]) { c.beginPath(); for (let x = -1.25; x <= 1.25; x += .02) c.lineTo(x * s, sg * .48 * s * Math.sin(x * 3.6)); c.stroke(); } c.lineWidth = .05 * s; for (let x = -1.2; x <= 1.21; x += .16) { const y = .48 * s * Math.sin(x * 3.6); c.beginPath(); c.moveTo(x * s, -y); c.lineTo(x * s, y); c.stroke(); } }],
  ["Teilchenphysik", (c, s) => { c.lineWidth = .045 * s; c.beginPath(); c.arc(0, 0, .95 * s, 0, 7); c.stroke(); for (let i = 0; i < 22; i++) { const a = i * 2.399, l = (.35 + ((i * 37) % 10) / 10 * .55) * s, b = ((i * 53) % 7 - 3) * .12; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(Math.cos(a + b) * l * .6, Math.sin(a + b) * l * .6, Math.cos(a) * l, Math.sin(a) * l); c.stroke(); } c.beginPath(); c.arc(0, 0, .09 * s, 0, 7); c.fill(); }],
  ["Raumfahrt", (c, s) => { c.rotate(Math.PI / 2); c.beginPath(); c.moveTo(0, -1.2 * s); c.bezierCurveTo(.36 * s, -.75 * s, .3 * s, .1 * s, .24 * s, .55 * s); c.lineTo(-.24 * s, .55 * s); c.bezierCurveTo(-.3 * s, .1 * s, -.36 * s, -.75 * s, 0, -1.2 * s); c.fill();
    for (const g of [1, -1]) { c.beginPath(); c.moveTo(g * .24 * s, .1 * s); c.lineTo(g * .58 * s, .7 * s); c.lineTo(g * .24 * s, .55 * s); c.fill(); }
    c.globalCompositeOperation = "destination-out"; c.beginPath(); c.arc(0, -.45 * s, .13 * s, 0, 7); c.fill(); c.globalCompositeOperation = "source-over";
    c.globalAlpha = .5; c.beginPath(); c.moveTo(-.16 * s, .62 * s); c.lineTo(0, 1.2 * s); c.lineTo(.16 * s, .62 * s); c.fill(); c.globalAlpha = 1; }],
  ["Robotik", (c, s) => { const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); };
    rr(-.6 * s, -.75 * s, 1.2 * s, 1.1 * s, .26 * s); rr(-.76 * s, -.38 * s, .11 * s, .42 * s, .04 * s); rr(.65 * s, -.38 * s, .11 * s, .42 * s, .04 * s);
    rr(-.035 * s, -1.0 * s, .07 * s, .26 * s, 0); c.beginPath(); c.arc(0, -1.04 * s, .09 * s, 0, 7); c.fill();
    rr(-.2 * s, .38 * s, .4 * s, .26 * s, 0); rr(-.95 * s, .66 * s, 1.9 * s, .3 * s, .14 * s);
    c.globalCompositeOperation = "destination-out"; rr(-.44 * s, -.46 * s, .88 * s, .38 * s, .16 * s); c.globalCompositeOperation = "source-over";
    c.beginPath(); c.arc(-.2 * s, -.27 * s, .085 * s, 0, 7); c.arc(.2 * s, -.27 * s, .085 * s, 0, 7); c.fill(); }],
];
// Zeichnet ein Motiv als Fläche und gibt seine Punkte zurück, von links nach rechts sortiert.
function sample(k, cx, cy, s) {
  const w = Math.ceil(2.9 * s), h = Math.ceil(2.7 * s), o = document.createElement("canvas"); o.width = w; o.height = h; const c = o.getContext("2d");
  c.fillStyle = c.strokeStyle = "#fff"; c.lineCap = "round"; c.translate(w / 2, h / 2); SHAPES[k][1](c, s);
  const px = c.getImageData(0, 0, w, h).data, pts = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const al = px[(y * w + x) * 4 + 3]; if (al > 40 && Math.random() * 255 < al) pts.push([cx - w / 2 + x, cy - h / 2 + y]); }
  return pts.sort((a, b) => a[0] - b[0]);
}
function give(list, pts) { list.forEach((p, j) => { const q = pts[Math.min(pts.length - 1, Math.floor((j + Math.random() * 20) / (list.length + 20) * pts.length))]; p.sx = q[0] + Math.random(); p.sy = q[1] + Math.random(); }); }

function build() {
  const r = stage.getBoundingClientRect(), b = ph.getBoundingClientRect(), d = Math.min(3, devicePixelRatio || 1);
  W = r.width; H = r.height; F = parseFloat(getComputedStyle(ph).fontSize); mark = { x: b.left - r.left, y: b.bottom - r.top };
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  bars = Array.from({ length: 9 }, (_, i) => ({ x: mark.x + i * .255 * F, w: .17 * F, h: (i === 8 ? 1 : .72) * F }));
  const total = bars.reduce((s, x) => s + x.h, 0); P = [];
  bars.forEach((x, i) => { const n = Math.round(N * x.h / total); for (let k = 0; k < n; k++) { const tx = x.x + Math.random() * x.w, ty = mark.y - Math.random() * x.h; P.push({ bar: i, tx, ty, sx: tx, sy: ty, x: tx, y: ty, vx: 0, vy: 0, s: Math.random() * 6.28, r: Math.random(), in: true }); } });
}
// Drei Felder über dem Logo, drei darunter. Das Logo ist die Mitte von allem.
function play(first) {
  hold = first ? 1900 : 1300; labels = []; shown = false;
  const cw = (W - 24) / 3, s = Math.min(cw / 3.0, H * .29 / 2.9), groups = SHAPES.map(() => []);
  P.forEach((p, i) => groups[i % 6].push(p));
  SHAPES.forEach((sh, k) => { const cx = 12 + cw * (k % 3 + .5), cy = H * (k < 3 ? .17 : .83) - 8; give(groups[k], sample(k, cx, cy, s)); labels.push([sh[0], cx, cy + 1.35 * s + 14]);
    groups[k].forEach(p => { p.in = false; if (first) { p.x = cx + (Math.random() - .5) * cw; p.y = cy + (Math.random() - .5) * cw; p.vx = p.vy = 0; } }); });
  stage.classList.add("pre"); t0 = performance.now();
  if (!running) { running = true; requestAnimationFrame(frame); }
}
function draw(e) {
  ctx.clearRect(0, 0, W, H); const r = Math.max(.7, F / 105);
  // leere Segmente als Umriss, solange die Skala noch nicht gefüllt ist
  const oa = Math.max(0, 1 - (e - hold - 500) / 700);
  if (oa > 0) { ctx.globalAlpha = oa; ctx.lineWidth = 1; bars.forEach((b, i) => { ctx.strokeStyle = i === 8 ? "#8A3A12" : "#34494D"; ctx.strokeRect(b.x + .5, mark.y - b.h + .5, b.w - 1, b.h - 1); }); ctx.globalAlpha = 1; }
  ctx.fillStyle = "#EAF0ED"; for (const p of P) if (p.bar < 8) ctx.fillRect(p.x, p.y, r, r);
  ctx.fillStyle = "#FF5A0A"; for (const p of P) if (p.bar === 8) ctx.fillRect(p.x, p.y, r, r);
  const a = Math.min(1, e / 500) * Math.max(0, 1 - (e - hold) / 250);
  if (labels.length && a > 0) { ctx.globalAlpha = a; ctx.fillStyle = "#8EA3A2"; ctx.font = '500 10px "IBM Plex Mono", monospace'; ctx.textAlign = "center"; labels.forEach(l => ctx.fillText(l[0].toUpperCase(), l[1], l[2])); ctx.globalAlpha = 1; }
}
function frame() {
  const now = performance.now(), e = now - t0, t = now / 1000, mx = mark.x + 1.1 * F, my = mark.y - .5 * F;
  for (const p of P) {
    if (!p.in && e > hold + p.bar * 90 + p.r * 220) { p.in = true; const dx = p.x - mx, dy = p.y - my, l = Math.hypot(dx, dy) || 1; p.vx += -dy / l * F * .09; p.vy += dx / l * F * .09; }   // kleiner Drall: die Punkte strömen im Bogen zur Mitte
    const j = (p.in ? (p.bar === 8 ? .02 : .006) : .01) * F, gx = p.in ? p.tx : p.sx, gy = p.in ? p.ty : p.sy;
    p.vx = (p.vx + (gx + Math.sin(t * 2.3 + p.s) * j - p.x) * .06) * .81; p.vy = (p.vy + (gy + Math.cos(t * 1.9 + p.s) * j - p.y) * .06) * .81; p.x += p.vx; p.y += p.vy;
  }
  draw(e);
  if (!shown && e > hold + 1300) { shown = true; stage.classList.remove("pre"); }
  if (e < hold + 5000) requestAnimationFrame(frame); else running = false;   // danach steht das Logo still und kostet keinen Akku
}
function rest() { build(); labels = []; hold = -1e9; stage.classList.remove("pre"); draw(1e9); }
const replay = () => { if (reduced) return; if (!P.length) build(); play(false); };
document.getElementById("lock").addEventListener("click", replay);
document.getElementById("again").addEventListener("click", replay);
let rw = 0; new ResizeObserver(() => { const w = stage.clientWidth; if (rw && Math.abs(w - rw) > 2) rest(); rw = w; }).observe(stage);
const start = () => { build(); if (reduced) draw(1e9); else play(true); };
document.fonts && document.fonts.ready ? document.fonts.ready.then(start) : start();
</script>
